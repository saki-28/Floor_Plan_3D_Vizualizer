<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloorPlan3D</title>
    <meta name="description" content="Turn 2D floor plans into interactive 3D models, with an explainable image pipeline." />
    <meta property="og:title" content="FloorPlan3D" />
    <meta property="og:description" content="Turn 2D floor plans into interactive 3D models, with an explainable image pipeline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before first paint, so the page never flashes the other one.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('floorplan3d-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
